<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Página no encontrada · Mockups</title>
<style>
  :root{--bg:#f6f5f2;--ink:#1a1b1e;--muted:#6b6f76;--accent:#e2400a;}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:grid;place-items:center;text-align:center;
       background:var(--bg);color:var(--ink);padding:24px;
       font:16px/1.5 ui-sans-serif,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  .code{font-size:clamp(64px,18vw,140px);font-weight:800;letter-spacing:-.04em;line-height:1;margin:0;}
  p{color:var(--muted);margin:12px 0 28px;}
  a{display:inline-block;background:var(--ink);color:#fff;padding:12px 22px;border-radius:99px;
    font-weight:600;text-decoration:none;}
  a:hover{background:var(--accent);}
  a:focus-visible{outline:3px solid var(--accent);outline-offset:3px;}
</style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <p>No encontramos esta página. Puede que el mockup se haya movido.</p>
    <a id="home" href="/">Volver al índice</a>
  </main>
  <script>
    (function () {
      var seg = location.pathname.split('/').filter(Boolean)[0];
      if (seg) document.getElementById('home').href = '/' + seg + '/';
    })();
  </script>
</body>
</html>
